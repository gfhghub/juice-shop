name: Generate package-lock.json

# Run manually from the Actions tab. Generates a lockfile for Aikido's
# dependency scanner WITHOUT installing packages or compiling native modules.
on:
  workflow_dispatch:

permissions:
  contents: write   # needed so the workflow can push the lockfile back

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove the setting that blocks lockfiles
        run: sed -i '/package-lock/d' .npmrc || true

      - name: Generate lockfile only (no install, no native build)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit and push the lockfile
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add package-lock.json .npmrc
          git commit -m "Add package-lock.json for Aikido dependency scanning" || echo "nothing to commit"
          git push
